<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Green Acres Landscaping{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-green-50 text-gray-800">
  <nav class="bg-green-800 text-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4">
      <a href="{{ url_for('home') }}" class="text-lg font-bold">🌿 Green Acres</a>
      <div class="flex gap-5 text-sm">
        <a href="{{ url_for('home') }}" class="hover:underline">Home</a>
        <a href="{{ url_for('about') }}" class="hover:underline">About</a>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-4xl px-4 py-8">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="mb-4 rounded-lg border border-green-300 bg-white p-3 text-sm">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="py-6 text-center text-xs text-gray-500">&copy; Green Acres Landscaping</footer>
</body>
</html>
