{% extends "base.html" %}
{% block title %}Free Estimate | Green Acres{% endblock %}

{% block content %}
<section class="mb-8">
  <h1 class="text-3xl font-bold text-green-900">Get a free estimate in minutes</h1>
  <p class="mt-2 text-gray-600">Tell us about your property and we'll email you a price range.</p>
</section>

<form action="/estimate" method="post" class="space-y-4 rounded-xl border border-green-200 bg-white p-6 shadow-sm">
  <div>
    <label for="email" class="mb-1 block text-sm font-medium">Email</label>
    <input id="email" name="email" type="email" required
           class="w-full rounded-lg border border-gray-300 px-3 py-2">
  </div>
  <div>
    <label for="service" class="mb-1 block text-sm font-medium">Service</label>
    <select id="service" name="service" class="w-full rounded-lg border border-gray-300 px-3 py-2">
      <option value="mowing">Lawn mowing</option>
      <option value="mulching">Mulching</option>
      <option value="cleanup">Cleanup / hauling</option>
    </select>
  </div>
  <div>
    <label for="acreage" class="mb-1 block text-sm font-medium">Acreage</label>
    <input id="acreage" name="acreage" type="number" step="0.01" min="0.01" required
           class="w-full rounded-lg border border-gray-300 px-3 py-2">
  </div>
  <div>
    <label for="condition" class="mb-1 block text-sm font-medium">Yard condition</label>
    <select id="condition" name="condition" class="w-full rounded-lg border border-gray-300 px-3 py-2">
      <option value="maintained">Maintained</option>
      <option value="somewhat">Somewhat overgrown</option>
      <option value="heavy">Heavily overgrown</option>
    </select>
  </div>
  <button type="submit" class="w-full rounded-lg bg-green-700 py-2.5 font-semibold text-white hover:bg-green-800">
    Email me my estimate
  </button>
</form>
{% endblock %}
